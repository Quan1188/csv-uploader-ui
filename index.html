<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload CSV to FastAPI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #fff;
      color: #111;
    }
    h1 {
      font-size: 2rem;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1rem;
    }
    pre {
      background: #f6f6f6;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📤 Upload CSV file</h1>
    <input type="file" id="fileInput" accept=".csv" />
    <br/>
    <button onclick="uploadFile()">Upload</button>
    <pre id="response"></pre>
  </div>

  <script>
    async function uploadFile() {
      const input = document.getElementById('fileInput');
      if (!input.files.length) {
        alert("Please select a file.");
        return;
      }

      const file = input.files[0];
      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch("https://36cd-1-55-201-59.ngrok-free.app/upload-csv/", {
        method: "POST",
        body: formData
      });

      const result = await res.json();
      document.getElementById("response").textContent = JSON.stringify(result, null, 2);
    }
  </script>
</body>
</html>
