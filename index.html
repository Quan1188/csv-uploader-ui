<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>📤 Tải lên CSV</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input[type="file"] {
      margin-bottom: 20px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      font-weight: bold;
      margin-top: 20px;
      font-size: 15px;
    }

    .success {
      color: #28a745;
    }

    .error {
      color: #dc3545;
    }

    .warning {
      color: #ffc107;
    }

    pre {
      background: #f1f1f1;
      text-align: left;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      max-height: 300px;
      overflow: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📤 Tải lên file CSV</h2>
    <input type="file" id="fileInput" accept=".csv" />
    <br/>
    <button onclick="uploadFile()">Tải lên</button>

    <div id="message" class="message"></div>
    <pre id="response"></pre>
  </div>

  <script>
    async function uploadFile() {
      const input = document.getElementById('fileInput');
      const message = document.getElementById('message');
      const responseBox = document.getElementById('response');
      message.textContent = '';
      message.className = 'message';
      responseBox.textContent = '';

      if (!input.files.length) {
        message.textContent = "❗ Vui lòng chọn một file CSV.";
        message.classList.add("error");
        return;
      }

      const file = input.files[0];
      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("http://localhost:8000/upload-csv/", {
          method: "POST",
          body: formData
        });

        const result = await res.json();

        if (res.ok && result.status === "success") {
          message.textContent = "✅ Tải lên thành công!";
          message.classList.add("success");
        } else if (res.ok && result.status === "partial_success") {
          message.textContent = `⚠️ Một phần thành công: ${result.rows_inserted} dòng thành công, ${result.rows_failed} dòng lỗi.`;
          message.classList.add("warning");
        } else {
          message.textContent = "❌ Tải lên thất bại.";
          message.classList.add("error");
        }

        responseBox.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        message.textContent = "❌ Lỗi kết nối đến máy chủ.";
        message.classList.add("error");
        responseBox.textContent = error.toString();
      }
    }
  </script>
</body>
</html>
