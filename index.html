<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Upload CSV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #fefefe;
      color: #111;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    .message {
      font-weight: bold;
      margin-top: 15px;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
    pre {
      background: #f8f8f8;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📤 Tải lên file CSV</h2>
    <input type="file" id="fileInput" accept=".csv" />
    <br/>
    <button onclick="uploadFile()">Tải lên</button>

    <div id="message" class="message"></div>
    <pre id="response"></pre>
  </div>

  <script>
    async function uploadFile() {
      const input = document.getElementById('fileInput');
      const message = document.getElementById('message');
      const responseBox = document.getElementById('response');
      message.textContent = '';
      responseBox.textContent = '';

      if (!input.files.length) {
        alert("Vui lòng chọn một file CSV.");
        return;
      }

      const file = input.files[0];
      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("https://36cd-1-55-201-59.ngrok-free.app/upload-csv/", {
          method: "POST",
          body: formData
        });

        const result = await res.json();
        if (res.ok && result.status === "success") {
          message.textContent = "✅ Tải lên thành công!";
          message.className = "message success";
        } else if (res.ok && result.status === "partial_success") {
          message.textContent = `⚠️ Tải lên một phần: ${result.rows_inserted} dòng thành công, ${result.rows_failed} dòng lỗi.`;
          message.className = "message error";
        } else {
          message.textContent = "❌ Tải lên thất bại.";
          message.className = "message error";
        }

        responseBox.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        message.textContent = "❌ Lỗi kết nối đến máy chủ.";
        message.className = "message error";
        responseBox.textContent = error.toString();
      }
    }
  </script>
</body>
</html>
